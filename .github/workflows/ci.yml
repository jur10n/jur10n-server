name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm ci --prefix server --no-fund --no-audit || true
          # npm 11 的 install-scripts 门闸可能拦掉 argon2 构建；兜底重建
          npm rebuild --prefix server argon2 || true
      - name: Run tests
        run: npm --prefix server test

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix dashboard --no-fund --no-audit
      - run: npm run build --prefix dashboard
